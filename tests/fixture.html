<!DOCTYPE html>
<html>
<body>
  <form id="jobForm">
    <input name="firstName" placeholder="First Name" />
    <input name="last_name" placeholder="Last Name" />
    <input type="email" name="candidateEmail" placeholder="Enter your email" autocomplete="email" />
    <input type="tel" name="mobile_number" placeholder="Mobile Number" />
    <input name="linkedinUrl" placeholder="LinkedIn Profile" />
    <input name="githubProfile" placeholder="GitHub" />
    <textarea name="summary" placeholder="Tell us about yourself"></textarea>

    <label for="countrySelect">Country</label>
    <select id="countrySelect" name="country">
      <option value="">Select</option>
      <option value="US">United States</option>
      <option value="IN">India</option>
      <option value="GB">United Kingdom</option>
    </select>

    <label for="stateSelect">State</label>
    <select id="stateSelect" name="state">
      <option value="">Select</option>
      <option value="CA">CA - California</option>
      <option value="NY">NY - New York</option>
    </select>

    <fieldset>
      <legend>Are you authorized to work in this country?</legend>
      <input type="radio" name="workAuth" id="workAuthYes" value="yes" />
      <label for="workAuthYes">Yes</label>
      <input type="radio" name="workAuth" id="workAuthNo" value="no" />
      <label for="workAuthNo">No</label>
    </fieldset>

    <input type="checkbox" id="relocate" name="relocate" />
    <label for="relocate">Willing to Relocate</label>

    <input type="password" name="accountPassword" placeholder="Password" />
    <input type="text" name="upi_pin" placeholder="UPI PIN" />

    <input name="q7" id="q7" placeholder="Your answer" />

    <div class="q-wrap">
      <label for="field_x1">Expected Salary</label>
      <input id="field_x1" name="field_x1" aria-label="Expected Salary" />
    </div>

    <input name="stackoverflowUrl" placeholder="Stack Overflow" />
  </form>
</body>
</html>
